<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>게시글 작성</title>
    <style>
        /* 전역 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #f4f7fa;
            color: #333;
            text-align: center;
            padding: 20px;
        }

        h1 {
            font-size: 2.5em;
            color: #4CAF50;
            margin-bottom: 30px;
        }

        /* 폼 스타일 */
        form {
            width: 60%;
            margin: 0 auto;
            padding: 20px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 8px;
            font-weight: bold;
            color: #4CAF50;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            color: #333;
        }

        textarea {
            resize: vertical;
        }

        input[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #007BFF;
            color: white;
            font-size: 1.2em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
            transform: translateY(-3px);
        }

        input[type="submit"]:active {
            background-color: #003f7d;
            transform: translateY(0);
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            form {
                width: 90%;
            }

            input[type="submit"] {
                font-size: 1em;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
<h1>게시글 작성</h1>
<form action="/save" method="post" enctype="multipart/form-data">
    <label for="boardTitle">제목:</label>
    <input type="text" name="boardTitle" id="boardTitle"><br>

    <label for="boardWriter">작성자:</label>
    <input type="text" name="boardWriter" id="boardWriter"><br>

    <label for="boardPass">비밀번호:</label>
    <input type="text" name="boardPass" id="boardPass"><br>

    <label for="boardContents">내용:</label>
    <textarea name="boardContents" id="boardContents" cols="30" rows="10"></textarea><br>

    <input type="submit" value="작성">
</form>
</body>
</html>
